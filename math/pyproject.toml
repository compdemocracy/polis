[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polismath"
version = "0.1.0"
description = "Polis math engine — certified Clojure-exact PCA / k-means / repness, with the production math poller"
requires-python = ">=3.12,<3.13" # Pin to Python 3.12.x (matches delphi)

# Version pins mirror delphi/pyproject.toml (the two packages share one
# environment: delphi depends on polismath and installs both into
# delphi/.venv — see delphi/pyproject.toml [tool.uv.sources]).
dependencies = [
    "numpy>=1.26.4,<2.0",
    "pandas>=2.1.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.2",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary==2.9.10",
    "boto3==1.34.70",
    "click>=8.3.1",
    "natsort>=8.4.0",
    "pyyaml>=6.0",
]

[project.scripts]
run-math-pipeline = "polismath.run_math_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["polismath"]

# Pyright: math/ is its own project root for files under math/polismath.
# The interpreter is SHARED with delphi (polismath is installed editable
# into delphi/.venv), hence the venvPath one level up and across.
[tool.pyright]
include = ["polismath"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
]
venvPath = "../delphi"
venv = ".venv"
pythonVersion = "3.12"

# Pinned to the same toolchain as queue-rs/rust-toolchain.toml so the CLI, its
# shared contracts crate and the queue-rs workspace build with one compiler.
# Must satisfy the workspace's `rust-version` (MSRV) in Cargo.toml: 1.88.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"

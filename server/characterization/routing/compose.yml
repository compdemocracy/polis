name: ${COMPOSE_PROJECT_NAME:?set unique project}
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_PASSWORD: generatedlocal
      POSTGRES_DB: routing_recordings
    ports: ["127.0.0.1:${POLIS_RECOVERY_PG_PORT:?set unique port}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routing_recordings"]
      interval: 1s
      timeout: 2s
      retries: 30

services:
  postgres:
    image: ${POLIS_MIGRATE_TEST_IMAGE:?run fresh-image.sh with an owned project}
    healthcheck:
      # The initdb temporary server accepts socket connections before the runner
      # has finished. TCP readiness waits for the final server after initialization.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres"]

[package]
name = "polis-queue-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

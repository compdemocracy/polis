[package]
name = "polis-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"
description = "Conversation authority decisions over verified Polis identities"

[features]
db-tests = []

[dependencies]
base64 = "0.22"
serde_json = "1"
postgres = "0.19"
jsonwebtoken = "9"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "net", "io-util"] }
polis-migrate = { path = "../polis-migrate" }
openssl = "0.10"
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

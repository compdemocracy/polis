[package]
name = "polis-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"
description = "Conversation authority decisions over verified Polis identities"

[features]
db-tests = []

[dependencies]
postgres = "0.19"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
openssl = "0.10"
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command: [postgres, -c, max_connections=240]
    ports: ["127.0.0.1:${MIXED_PG_PORT:?}:5432"]
    networks: [sealed]
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports: ["127.0.0.1:${MIXED_DYNAMO_PORT:?}:8000"]
    networks: [sealed]
networks:
  sealed:
    driver: bridge

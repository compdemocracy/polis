# Both page switches enabled only inside this generated fixture stack.
services:
  polis-api:
    environment:
      POLIS_API_IIP_READS: "1"
      POLIS_API_IIM_READS: "1"
      POLIS_API_LINK_PAGES_DATABASE_URL: postgres://postgres@postgres:5432/p027
  polis-api-off:
    image: ${X54_POLIS_API_IMAGE:-x54pca2-polis-api:conformance}
    networks: [sealed]
    environment:
      MATH_ENV: p027
      DEV_MODE: "true"
      NODE_ENV: production
      DOMAIN_OVERRIDE: localhost
      DATABASE_URL: postgres://postgres@postgres:5432/p027
      POLIS_API_DB_TRANSPORT: docker-internal
      POLIS_API_DB_PLAIN_HOSTS: postgres
      POLIS_API_LISTEN: 0.0.0.0:5100
      POLIS_API_FIXTURE_CLOCK: "1700000000000"

# Test-only opt-in; production defaults stay off.
services:
  polis-api:
    environment:
      POLIS_API_CONVERSATION_PAGE_READS: "1"
      POLIS_API_CONVERSATION_PAGES_DATABASE_URL: postgres://postgres@postgres:5432/p027
      STATIC_FILES_HOST: file-server
      STATIC_FILES_PARTICIPATION_PORT: "8080"
  polis-api-off:
    image: ${X54_POLIS_API_IMAGE:-x54pca2-polis-api:conformance}
    networks: [sealed]
    environment:
      MATH_ENV: p027
      DEV_MODE: "true"
      NODE_ENV: production
      DOMAIN_OVERRIDE: localhost
      DATABASE_URL: postgres://postgres@postgres:5432/p027
      POLIS_API_DB_TRANSPORT: docker-internal
      POLIS_API_DB_PLAIN_HOSTS: postgres
      POLIS_API_LISTEN: 0.0.0.0:5100
      POLIS_API_FIXTURE_CLOCK: "1700000000000"
  server:
    environment:
      STATIC_FILES_HOST: file-server
      STATIC_FILES_PARTICIPATION_PORT: "8080"
  file-server:
    image: ${P027_SERVER_IMAGE:-polis-server:conformance}
    entrypoint: [node, /conformance/conversation-pages-static.cjs]
    networks: [sealed]
    volumes:
      - ../../queue-rs/polis-api/conformance:/conformance:ro

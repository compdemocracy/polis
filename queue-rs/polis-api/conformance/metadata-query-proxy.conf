# Exercises the product location with the real Node handler and Rust handoff.
server {
    listen 80;
    resolver 127.0.0.11 ipv6=off;
    set $polis_api_target polis-api:5100;
    include /etc/nginx/metadata-query.location.conf;
    location @polis_node_api {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

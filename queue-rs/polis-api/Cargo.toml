[package]
name = "polis-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"
description = "Rust process that serves GET /api/v3/math/pca2 byte-for-byte like the Node server"

[features]
default = []
# Conformance builds only: lets POLIS_API_FIXTURE_CLOCK pin "now" the way the
# characterization harness pins Node's Date.now(). A release build without this
# feature has no way to fake the clock.
fixture-clock = []
# Tests of the three queries against a real Postgres. With the feature on, a
# missing POLIS_API_TEST_DATABASE_URL fails the run.
db-tests = []

[dependencies]
bcrypt = "0.17"
anyhow = "1"
base64 = "0.22"
httparse = "1"
md5 = "0.7"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
# raw_value and float_roundtrip, as the contracts crate has them: the
# Delphi run record (wire.rs) writes and reads numbers as JavaScript does.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# The run record's inputs digest (delphi_run.rs).
sha2 = "0.10"
url = "2"
uuid = "1"
rand = "0.10"
polis-auth = { path = "../polis-auth" }
polis-queue-adapter = { path = ".." }
postgres = "0.19"
ryu-js = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
libc = "0.2"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

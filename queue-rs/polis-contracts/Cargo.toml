[package]
name = "polis-contracts"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.88"
publish = false
# A member of the polis-cli workspace (one lockfile, polis-cli/Cargo.lock), not
# of the queue-rs workspace that shares this directory.
workspace = "../../polis-cli"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

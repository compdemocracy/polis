name: Nginx production upstreams
on:
  pull_request:
    paths: ['file-server/**', 'scripts/after_install.sh', 'docker-compose.yml', 'Makefile', '.github/workflows/nginx-upstreams.yml']
  push:
    branches: [edge]
    paths: ['file-server/**', 'scripts/after_install.sh', 'docker-compose.yml', 'Makefile', '.github/workflows/nginx-upstreams.yml']
permissions:
  contents: read
jobs:
  upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install template renderer dependency
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Check production upstreams
        run: make check-nginx-upstreams

name: polis-cli

# Format, lint and test the Polis CLI and its shared contracts crate through
# scripts/test-polis-cli.sh. The contracts crate's tests read two vote
# declaration fixtures from the server's test tree, so those trigger it too.
on:
  pull_request:
    paths:
      - 'polis-cli/**'
      - 'ci/tls/**'
      - 'queue-rs/polis-contracts/**'
      - 'server/__tests__/fixtures/vote-declaration/**'
      - 'scripts/test-polis-cli.sh'
      - 'scripts/build-polis-cli-release.py'
      - 'scripts/tests/test_polis_cli_release.py'
      - '.github/workflows/polis-cli-release-build.yml'
      - '.github/workflows/polis-cli-ci.yml'
  push:
    branches: [edge, stable]
    paths:
      - 'polis-cli/**'
      - 'ci/tls/**'
      - 'queue-rs/polis-contracts/**'
      - 'server/__tests__/fixtures/vote-declaration/**'
      - 'scripts/test-polis-cli.sh'
      - 'scripts/build-polis-cli-release.py'
      - 'scripts/tests/test_polis_cli_release.py'
      - '.github/workflows/polis-cli-release-build.yml'
      - '.github/workflows/polis-cli-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polis-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polis-cli:
    name: polis-cli format, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Format, clippy and tests
        run: scripts/test-polis-cli.sh

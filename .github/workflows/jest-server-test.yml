name: Server Integration Tests

concurrency:
  group: jest-server-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ edge, stable ]
  pull_request:
    branches:
      - edge
      - stable
      - 'jc/**'
  # Manual trigger: lets repo write-access users run CI on any branch
  # (including spr/edge/* stack branches, which `pull_request` no longer
  # auto-triggers for). UI: Actions → Server Integration Tests → "Run workflow".
  # CLI: `gh workflow run "Server Integration Tests" --ref <branch>`.
  workflow_dispatch:

jobs:
  # The vote-path recordings' golden is edge's served bytes: a PR may change it
  # or the server code it characterizes, never both (re-record from edge in a
  # PR of its own; see server/__tests__/integration/vote-path-recordings.test.ts).
  vote-path-golden-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: The vote-path golden never changes together with server code
      run: sh ci/vote_path_golden_guard.sh "origin/${{ github.base_ref }}"

  server-integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install mkcert
      run: |
        # Install mkcert for certificate generation
        curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
        chmod +x mkcert-v*-linux-amd64
        sudo cp mkcert-v*-linux-amd64 /usr/local/bin/mkcert
        
        # Install CA in system trust store
        mkcert -install

    - name: Generate certificates
      run: |
        # Create certificate directory in workspace (not home directory)
        mkdir -p ./.simulacrum/certs
        cd ./.simulacrum/certs
        
        # Generate certificates for all required hostnames
        mkcert -cert-file localhost.pem -key-file localhost-key.pem \
          localhost 127.0.0.1 ::1 oidc-simulator host.docker.internal
        
        # Copy mkcert root CA to the certs directory for Docker containers
        cp "$(mkcert -CAROOT)/rootCA.pem" ./rootCA.pem
        
        # List generated files for debugging
        echo "Generated certificates:"
        ls -la

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # The runner is discarded after the job; removing the builder only costs time.
        cleanup: false

    # BuildKit's GitHub Actions cache backend reads these from the environment;
    # the runner gives them to actions only, so hand them to the build step.
    - name: Expose the Actions cache service to BuildKit
      uses: actions/github-script@v7
      with:
        script: |
          for (const k of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
            if (process.env[k]) core.exportVariable(k, process.env[k])
          }

    - name: Create test.env with CI-specific paths
      run: |
        # Update AUTH_CERTS_PATH to use workspace-relative path
        sed -i 's|AUTH_CERTS_PATH=.*|AUTH_CERTS_PATH=./.simulacrum/certs|' test.env
        # Update JWKS_URI to use localhost for OIDC simulator
        sed -i 's|JWKS_URI=.*|JWKS_URI=https://localhost:3000/.well-known/jwks.json|' test.env
        
        # Copy test.env to .env for docker-compose variable interpolation
        cp test.env .env
        
        # Also copy test.env to server directory for the test environment
        cp test.env server/.env
        
        # Show relevant env vars for debugging
        echo "Environment variables:"
        grep -E "AUTH_|CERT|DATABASE_URL|POSTGRES_|JWT_|JWKS_URI" test.env || true

    - name: Build Docker images
      env:
        # Layer cache kept by the test-stack image builds (test-images.yml).
        POLIS_TEST_IMAGES_CACHE_FROM: type=gha,scope=polis-test-{image}
      run: |
        # Build only the services these tests need (tests run on host); ses-local
        # and dynamodb are pulled, not built.
        # The math engine (math-python) is intentionally excluded: the server
        # integration tests insert math_* rows directly and gate all live-math
        # assertions behind a hasMathData flag, so they pass with or without it.
        bash ci/local/test-images.sh build --tag ci --only postgres,file-server,oidc-simulator
        bash ci/local/test-images.sh override ci "$RUNNER_TEMP/images.yml" postgres file-server oidc-simulator

    - name: Apply and check test database migrations
      run: bash ci/test-migrations.sh -f "$RUNNER_TEMP/images.yml"

    - name: Start services
      run: |
        # Start only required services in detached mode (exclude server + math-python).
        # They come up while the server dependencies install; the health step waits for them.
        docker compose -f docker-compose.test.yml -f "$RUNNER_TEMP/images.yml" --env-file test.env up -d \
          postgres file-server ses-local oidc-simulator dynamodb minio minio-init

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.23.4"
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install server dependencies
      run: |
        cd server
        npm ci

    - name: Check service health
      run: |
        # Wait (up to 120 s) until postgres, the OIDC simulator, DynamoDB and MinIO answer.
        for i in $(seq 1 60); do
          docker compose -f docker-compose.test.yml exec -T postgres pg_isready -U postgres >/dev/null 2>&1 \
            && curl -ksf -o /dev/null https://localhost:3000/.well-known/jwks.json \
            && curl -s -o /dev/null http://localhost:8000 \
            && curl -s -o /dev/null http://localhost:9000 \
            && break
          sleep 2
        done
        docker compose -f docker-compose.test.yml ps

        # Check if key services are responding
        echo "Checking postgres..."
        docker compose -f docker-compose.test.yml exec -T postgres pg_isready -U postgres || true
        
        echo "Checking oidc-simulator..."
        curl -k -f https://localhost:3000/.well-known/jwks.json || true
        
        echo "Checking DynamoDB..."
        curl -f http://localhost:8000 || true
        # Alternative check using AWS CLI if available
        aws dynamodb list-tables --endpoint-url http://localhost:8000 --region us-east-1 2>/dev/null || true

    - name: Generated contract files match the TypeBox source
      run: |
        # Fails when a committed generated file (server, client-participation-alpha,
        # client-report) differs from what server/src/contracts would generate.
        # Fix with `npm run contract:generate` in server/ and commit the result.
        cd server
        npm run contract:check

    - name: Check API migration readiness
      working-directory: server
      env:
        DATABASE_URL: postgres://postgres:PdwPNS2mDN73Vfbc@localhost:5432/polis-test
        DATABASE_SSL: "false"
      run: node src/db/migrations.cjs

    - name: Run server integration tests
      run: |
        cd server
        
        NODE_EXTRA_CA_CERTS=$(pwd)/../.simulacrum/certs/rootCA.pem \
        CI=true \
        NODE_ENV=test \
        DATABASE_URL=postgres://postgres:PdwPNS2mDN73Vfbc@localhost:5432/polis-test \
        STATIC_FILES_HOST=localhost \
        DYNAMODB_ENDPOINT=http://localhost:8000 \
        SES_ENDPOINT=http://localhost:8005 \
        AWS_S3_ENDPOINT=http://localhost:9000 \
        AWS_S3_BUCKET_NAME=polis-delphi \
        AWS_ACCESS_KEY_ID=DUMMYIDEXAMPLE \
        AWS_SECRET_ACCESS_KEY=DUMMYEXAMPLEKEY \
        AWS_REGION=us-east-1 \
        npm test -- --ci --coverage --maxWorkers=2

    - name: Upload test coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: server/coverage
        if-no-files-found: ignore

    - name: Show service logs
      if: failure()
      run: |
        # Show logs from critical services for debugging
        echo "=== OIDC Simulator logs ==="
        docker compose -f docker-compose.test.yml logs oidc-simulator | tail -100
        
        echo "=== Postgres logs ==="
        docker compose -f docker-compose.test.yml logs postgres | tail -100

        echo "=== DynamoDB logs ==="
        docker compose -f docker-compose.test.yml logs dynamodb | tail -100

    - name: Clean up
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down -v

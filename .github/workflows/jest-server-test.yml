name: Server Integration Tests

concurrency:
  group: jest-server-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ edge, stable ]
  pull_request:
    branches:
      - edge
      - stable
      - 'jc/**'
  # Manual trigger: lets repo write-access users run CI on any branch
  # (including spr/edge/* stack branches, which `pull_request` no longer
  # auto-triggers for). UI: Actions → Server Integration Tests → "Run workflow".
  # CLI: `gh workflow run "Server Integration Tests" --ref <branch>`.
  workflow_dispatch:

jobs:
  # The vote-path recordings' golden is edge's served bytes: a PR may change it
  # or the server code it characterizes, never both (re-record from edge in a
  # PR of its own; see server/__tests__/integration/vote-path-recordings.test.ts).
  vote-path-golden-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: The vote-path golden never changes together with server code
      env:
        BASE_REF: origin/${{ github.base_ref }}
      run: make check-vote-path-guard

  server-integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Certificates, the edited test.env, the service list, readiness waits, the
    # jest environment and teardown all live in ci/local/server-integration.sh,
    # so `make check-server-integration` gives the same verdict on any Docker host.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Generated contract files match the TypeBox source
      # Fails when a committed generated file (server, client-participation-alpha,
      # client-report) differs from what server/src/contracts would generate.
      # Fix with `npm run contract:generate` in server/ and commit the result.
      run: make check-contracts

    - name: Run server integration tests
      run: make check-server-integration

    - name: Upload test coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: server/coverage
        if-no-files-found: ignore

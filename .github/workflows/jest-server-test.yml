name: Jest Tests

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - edge
    paths-ignore:
      - "**.md"

  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  jest-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Configure proper Docker layer caching
      - name: Set up Docker Cache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Copy test.env to .env
        run: cp test.env .env

      - name: Build and start Docker containers
        run: |
          # Build with proper cache configuration
          docker buildx build \
            --cache-from=type=local,src=${{ github.workspace }}/.buildx-cache \
            --cache-to=type=local,dest=${{ github.workspace }}/.buildx-cache-new,mode=max \
            --load \
            -f server/Dockerfile \
            ./server
          
          # Move cache to prevent cache growth
          rm -rf ${{ github.workspace }}/.buildx-cache
          mv ${{ github.workspace }}/.buildx-cache-new ${{ github.workspace }}/.buildx-cache
          
          # Start containers
          docker compose -f docker-compose.yml -f docker-compose.test.yml --profile postgres up -d --build
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      # Add Postgres health check
      - name: Wait for Postgres to be ready
        run: |
          # Wait for postgres to be ready
          until docker exec $(docker ps -q -f name=postgres) pg_isready -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done
          
          # Verify we can actually connect with the test credentials
          docker exec $(docker ps -q -f name=postgres) psql -U postgres -c "\l" polis-test

      - name: Run Jest tests
        run: |
          # Run tests inside the server container using the container name pattern from docker-compose
          docker exec polis-test-server-1 npm test

      - name: Stop Docker containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile postgres down

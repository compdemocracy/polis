name: Private probe box
on:
  workflow_dispatch:
    inputs:
      job:
        description: Reviewed job name from ci/probe_box/jobs.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-probe-box
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/edge'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: probe-box
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare public dispatcher
        run: python -m pip install --quiet -r ci/probe_box/requirements.txt >/dev/null 2>&1
      - name: Dispatch and verify cleanup
        env:
          AWS_REGION: ${{ vars.PROBE_REGION }}
          PROBE_DISPATCH_ROLE: ${{ vars.PROBE_DISPATCH_ROLE }}
          PROBE_CONTROL_FUNCTION: ${{ vars.PROBE_CONTROL_FUNCTION }}
          PROBE_JOB: ${{ inputs.job }}
        run: python ci/probe_box/dispatch.py

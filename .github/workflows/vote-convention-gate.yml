name: Vote convention gate

# P-078 PR-F. Proves, on every PR, that the stored vote sign does not matter:
# the same fixture set is loaded at storage convention v0 (agree = -1, today's
# data) and v1 (agree = +1), every vote-reading suite runs under each, and the
# outputs must be byte-identical. v0 is required. v1 is expected red until the
# convention row (PR-A) and the chokepoints (PR-B/C) land; its step reports the
# failing families and why, and becomes required when they do.
# The lint fails on any NEW vote-sign literal outside the chokepoint modules.

concurrency:
  group: vote-convention-gate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [edge, stable]
  pull_request:
    branches: [edge, stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-lint:
    name: vote-sign literal lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint and gate unit checks
        run: |
          python3 -m unittest ci/vote_convention/test_gate.py
          python3 ci/vote_convention/sign_lint.py

  two-convention:
    name: two storage conventions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: vote-gate-${{ github.run_id }}-${{ github.run_attempt }}
      VOTE_GATE_PG_PORT: '5470'
      OUT: ${{ github.workspace }}/.vote-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install the locked engine requirements and the server modules
        run: |
          python -m pip install -r coordinator-rs/evidence/python-requirements.txt
          npm ci --prefix server
      - name: v0 (agree = -1) — provision both conventions, run every leg, verdict on v0
        env:
          VOTE_GATE_V1: separate
          PYTHON: python
        run: ci/vote_convention/run.sh "$OUT"
      - name: v1 (agree = +1) against v0 — expected red until PR-A/B/C
        # Flip to required (remove continue-on-error) when PR-A and PR-B/C land.
        continue-on-error: true
        run: python ci/vote_convention/compare.py v1 "$OUT"
      - name: Keep the verdicts and outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vote-convention-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vote-gate
          include-hidden-files: true
          retention-days: 14

name: Prepare Polis promotion

# Merge the version PR, refresh and merge the promotion, then publish before deploy.
# Both jobs first compare candidate, in this workflow's own code and before
# checkout, with the current edge head. The version tool is compiled in a job
# that gives no run step a token; the job with write permission compiles nothing.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full current edge commit SHA (refresh after merging the version PR)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: polis-release
  cancel-in-progress: false

jobs:
  tool:
    if: github.ref == 'refs/heads/edge'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the current edge head (workflow code, before checkout)
        env:
          INPUT_COMMIT: ${{ inputs.candidate }}
          BRANCH: edge
        run: |
          expected="$(printf '%s\trefs/heads/%s' "$INPUT_COMMIT" "$BRANCH")"
          actual="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/heads/$BRANCH")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The input commit is not the current $BRANCH head"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Build the offline version tool (no step in this job gets a token)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/version-target
        run: (cd queue-rs && cargo build --locked --bin polis-version)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polis-version-tool
          path: ${{ runner.temp }}/version-target/debug/polis-version
          if-no-files-found: error
          retention-days: 14

  prepare:
    needs: tool
    if: github.ref == 'refs/heads/edge'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the current edge head (workflow code, before checkout)
        env:
          INPUT_COMMIT: ${{ inputs.candidate }}
          BRANCH: edge
        run: |
          expected="$(printf '%s\trefs/heads/%s' "$INPUT_COMMIT" "$BRANCH")"
          actual="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/heads/$BRANCH")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The input commit is not the current $BRANCH head"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: polis-version-tool
          path: ${{ runner.temp }}/tool
      - name: Prepare or refresh reviewed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ inputs.candidate }}
          VERSION_TOOL: ${{ runner.temp }}/tool/polis-version
        run: |
          chmod 0755 "$VERSION_TOOL"
          python3 scripts/polis_release.py prepare --candidate "$CANDIDATE" --tool "$VERSION_TOOL" --open-pr > "$RUNNER_TEMP/preparation.json"
          cat "$RUNNER_TEMP/preparation.json" >> "$GITHUB_STEP_SUMMARY"

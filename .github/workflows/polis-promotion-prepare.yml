name: Prepare Polis promotion

# Merge the version PR, refresh and merge the promotion, then publish before deploy.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full current edge commit SHA (refresh after merging the version PR)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: polis-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/edge'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build the offline version tool
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/version-target
        run: (cd queue-rs && cargo build --locked --bin polis-version)
      - name: Prepare or refresh reviewed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ inputs.candidate }}
          VERSION_TOOL: ${{ runner.temp }}/version-target/debug/polis-version
        run: |
          python3 scripts/polis_release.py prepare --candidate "$CANDIDATE" --tool "$VERSION_TOOL" --open-pr > "$RUNNER_TEMP/preparation.json"
          cat "$RUNNER_TEMP/preparation.json" >> "$GITHUB_STEP_SUMMARY"

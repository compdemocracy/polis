name: Treevite recordings
on:
  pull_request:
    branches: [edge, stable]
    paths:
      - 'server/characterization/**'
      - 'server/tsconfig.json'
      - 'server/app.ts'
      - 'server/index.ts'
      # Routes and shared dependencies used by the recorded treevite requests.
      - 'server/src/**'
      - 'server/postgres/**'
      - 'server/package*.json'
      - 'server/Dockerfile*'
      - 'oidc-simulator/**'
      - 'file-server/**'
      - 'client-participation/**'
      - 'queue-rs/polis-migrate/**'
      - 'queue-rs/polis-contracts/**'
      - 'queue-rs/Cargo.*'
      - 'queue-rs/rust-toolchain.toml'
      - 'scripts/after_install.sh'
      - 'delphi/polismath/utils/vote_convention.py'
      - 'VERSION'
      - '.github/workflows/treevite-recordings.yml'
  push:
    branches: [edge]
    paths:
      - 'server/characterization/**'
      - 'server/tsconfig.json'
      - 'server/app.ts'
      - 'server/index.ts'
      # Routes and shared dependencies used by the recorded treevite requests.
      - 'server/src/**'
      - 'server/postgres/**'
      - 'server/package*.json'
      - 'server/Dockerfile*'
      - 'oidc-simulator/**'
      - 'file-server/**'
      - 'client-participation/**'
      - 'queue-rs/polis-migrate/**'
      - 'queue-rs/polis-contracts/**'
      - 'queue-rs/Cargo.*'
      - 'queue-rs/rust-toolchain.toml'
      - 'scripts/after_install.sh'
      - 'delphi/polismath/utils/vote_convention.py'
      - 'VERSION'
      - '.github/workflows/treevite-recordings.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: treevite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recordings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: p027treevite-ci-${{ github.run_id }}-${{ github.run_attempt }}
      P027_PORT_MIN: '56585'
      P027_PORT_MAX: '56587'
      POLIS_RECOVERY_PG_PORT: '56585'
      P027_HTTP_PORT: '56586'
      P027_CONTROL_PORT: '56587'
      P027_SERVER_IMAGE: treevite-server
      P027_POSTGRES_IMAGE: treevite-postgres
      P027_OIDC_IMAGE: treevite-oidc
      P027_FILE_SERVER_IMAGE: treevite-files
      P027_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build dependencies before starting the sealed network
        run: |
          docker pull amazon/dynamodb-local:latest
          docker build --target prod --build-arg NODE_ENV=production -t "$P027_SERVER_IMAGE" -f server/Dockerfile .
          docker build --build-context queue-rs=queue-rs -t "$P027_POSTGRES_IMAGE" -f server/Dockerfile-db server
          docker build -t "$P027_OIDC_IMAGE" oidc-simulator
          docker build -t "$P027_FILE_SERVER_IMAGE" --build-arg NODE_ENV=production --build-arg AUTH_AUDIENCE=users --build-arg AUTH_CLIENT_ID=dev-client-id --build-arg AUTH_ISSUER=https://localhost:3000/ --build-arg AUTH_NAMESPACE=https://pol.is/ --build-arg EMBED_SERVICE_HOSTNAME=localhost --build-arg GIT_HASH=characterization -f file-server/Dockerfile .
      - name: Record, replay twice, and compare live Node with the committed fixture
        run: bash server/characterization/treevite/run.sh
      - name: Preserve all outcomes, including failed oracles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: treevite-recordings
          path: |
            server/characterization/artifacts/treevite-*
      - name: Remove the owned stack
        if: always()
        run: |
          docker compose -f server/characterization/compose.yml -f server/characterization/treevite/compose.yml down -v --remove-orphans

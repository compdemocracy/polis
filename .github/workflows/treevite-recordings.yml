name: Treevite recordings
on:
  pull_request:
    branches: [edge, stable]
    paths:
      - 'ci/host_ports.py'
      - 'ci/test_host_ports.py'
      - 'ci/local/**'
      - 'Makefile'
      - 'server/characterization/**'
      - 'server/tsconfig.json'
      - 'server/app.ts'
      - 'server/index.ts'
      # Routes and shared dependencies used by the recorded treevite requests.
      - 'server/src/**'
      - 'server/postgres/**'
      - 'server/package*.json'
      - 'server/Dockerfile*'
      - 'oidc-simulator/**'
      - 'file-server/**'
      - 'client-participation/**'
      - 'queue-rs/polis-migrate/**'
      - 'queue-rs/polis-contracts/**'
      - 'queue-rs/Cargo.*'
      - 'queue-rs/rust-toolchain.toml'
      - 'scripts/after_install.sh'
      - 'delphi/polismath/utils/vote_convention.py'
      - 'VERSION'
      - '.github/workflows/treevite-recordings.yml'
  push:
    branches: [edge]
    paths:
      - 'ci/host_ports.py'
      - 'ci/test_host_ports.py'
      - 'ci/local/**'
      - 'Makefile'
      - 'server/characterization/**'
      - 'server/tsconfig.json'
      - 'server/app.ts'
      - 'server/index.ts'
      # Routes and shared dependencies used by the recorded treevite requests.
      - 'server/src/**'
      - 'server/postgres/**'
      - 'server/package*.json'
      - 'server/Dockerfile*'
      - 'oidc-simulator/**'
      - 'file-server/**'
      - 'client-participation/**'
      - 'queue-rs/polis-migrate/**'
      - 'queue-rs/polis-contracts/**'
      - 'queue-rs/Cargo.*'
      - 'queue-rs/rust-toolchain.toml'
      - 'scripts/after_install.sh'
      - 'delphi/polismath/utils/vote_convention.py'
      - 'VERSION'
      - '.github/workflows/treevite-recordings.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: treevite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recordings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: p027treevite-ci-${{ github.run_id }}-${{ github.run_attempt }}
      P027_PORT_MIN: '26585'
      P027_PORT_MAX: '26587'
      POLIS_RECOVERY_PG_PORT: '26585'
      P027_HTTP_PORT: '26586'
      P027_CONTROL_PORT: '26587'
      P027_SERVER_IMAGE: treevite-server
      P027_POSTGRES_IMAGE: treevite-postgres
      P027_OIDC_IMAGE: treevite-oidc
      P027_FILE_SERVER_IMAGE: treevite-files
      P027_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run treevite-recordings checks
        run: make check-treevite-recordings
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}
      - name: Preserve all outcomes, including failed oracles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: treevite-recordings
          path: |
            server/characterization/artifacts/treevite-*

name: queue-rs

# Build, lint and test the queue-rs crate (the polis-queue/1 adapter and the
# polis-jobs daemon). The integration tests run against a throwaway
# PostgreSQL 17 service container with the repository's migration chain and
# the draft 000023 vendored under queue-rs/tests/fixtures.
on:
  pull_request:
    paths:
      - 'queue-rs/**'
      - 'server/postgres/migrations/**'
      - '.github/workflows/queue-rs-ci.yml'
  push:
    branches: [edge, stable]
    paths:
      - 'queue-rs/**'
      - 'server/postgres/migrations/**'
      - '.github/workflows/queue-rs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queue-rs:
    name: queue-rs build, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The toolchain (pinned by queue-rs/rust-toolchain.toml), clippy, the unit
      # and protocol tests, and the integration tests against a throwaway
      # PostgreSQL 17 (host port 5432) live in ci/local/queue-rs.sh.
      - name: Clippy, unit, protocol and integration tests
        run: make check-queue-rs

name: queue-rs

# Build, lint and test the queue-rs workspace: the polis-queue/1 adapter and
# the polis-jobs daemon (job `queue-rs`), and the polis-api route server with
# its nginx routing switch (job `polis-api`). The integration tests run against a throwaway
# PostgreSQL 17 service container with the repository's migration chain,
# 000023 (the Delphi job table) included.
on:
  pull_request:
    paths:
      - 'ci/host_ports.py'
      - 'ci/test_host_ports.py'
      - 'ci/vendor_postgres.py'
      - 'ci/test_vendor_postgres.py'
      - 'ci/probe_box/**'
      - 'ci/private_cert/images/**'
      - 'server/characterization/isolation.py'
      - 'server/characterization/test_isolation.py'
      - 'ci/local/**'
      - 'Makefile'
      - 'queue-rs/**'
      - 'scripts/test-polis-auth.sh'
      # polis-auth mirrors isModerator; a change there re-runs its parity test.
      - 'server/src/utils/common.ts'
      # Cross-language participant JWT recordings and their Node minter.
      - 'server/__tests__/fixtures/participant-jwt/**'
      - 'server/__tests__/fixtures/identity/**'
      - 'server/src/auth/jwt-utils.ts'
      - 'delphi/scripts/job_graph_*.py'
      - 'delphi/tests/job_graph/**'
      - 'docs/job-graphs.md'
      - 'server/__tests__/integration/queue-substrate.test.ts'
      - 'server/jest.job-graphs.config.ts'
      - 'server/package*.json'
      - 'server/index.ts'
      - 'server/src/db/migrations.cjs'
      - 'server/Dockerfile-db'
      - 'server/postgres/init-migrations.sh'
      - 'scripts/after_install.sh'
      - 'scripts/validate_service.sh'
      - 'scripts/tests/test_api_health.py'
      # The shadow service's own definition and the environment its test stack starts from.
      - 'docker-compose.yml'
      - 'test.env'
      - 'file-server/nginx/**'
      - 'file-server/nginx.Dockerfile'
      - 'server/postgres/migrations/**'
      - '.github/workflows/**'
  push:
    branches: [edge, stable]
    paths:
      - 'ci/host_ports.py'
      - 'ci/test_host_ports.py'
      - 'ci/vendor_postgres.py'
      - 'ci/test_vendor_postgres.py'
      - 'ci/probe_box/**'
      - 'ci/private_cert/images/**'
      - 'server/characterization/isolation.py'
      - 'server/characterization/test_isolation.py'
      - 'ci/local/**'
      - 'Makefile'
      - 'queue-rs/**'
      - 'scripts/test-polis-auth.sh'
      # polis-auth mirrors isModerator; a change there re-runs its parity test.
      - 'server/src/utils/common.ts'
      # Cross-language participant JWT recordings and their Node minter.
      - 'server/__tests__/fixtures/participant-jwt/**'
      - 'server/__tests__/fixtures/identity/**'
      - 'server/src/auth/jwt-utils.ts'
      - 'delphi/scripts/job_graph_*.py'
      - 'delphi/tests/job_graph/**'
      - 'docs/job-graphs.md'
      - 'server/__tests__/integration/queue-substrate.test.ts'
      - 'server/jest.job-graphs.config.ts'
      - 'server/package*.json'
      - 'server/index.ts'
      - 'server/src/db/migrations.cjs'
      - 'server/Dockerfile-db'
      - 'server/postgres/init-migrations.sh'
      - 'scripts/after_install.sh'
      - 'scripts/validate_service.sh'
      - 'scripts/tests/test_api_health.py'
      # The shadow service's own definition and the environment its test stack starts from.
      - 'docker-compose.yml'
      - 'test.env'
      - 'file-server/nginx/**'
      - 'file-server/nginx.Dockerfile'
      - 'server/postgres/migrations/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-ports:
    name: Test harness host ports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install psycopg2-binary==2.9.11
      - run: make check-host-ports
  queue-rs:
    name: queue-rs build, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: queue_acceptance
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 25462:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queue_acceptance"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: queue-rs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run queue-rs checks
        run: make check-queue-rs
        working-directory: .
        env:
          POLIS_JOBS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:25462/queue_acceptance
          POLIS_JOBS_TEST_PYTHON: python3
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}
  polis-auth:
    name: conversation authority rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: authority_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 25462:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authority_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Format, lint and authority parity tests
        env:
          POLIS_AUTH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:25462/authority_test?sslmode=disable
        run: bash scripts/test-polis-auth.sh

  polis-api:
    name: polis-api build, clippy, tests, image and nginx routing
    runs-on: ubuntu-24.04
    # Room for the shadow stack test and the comment shadow's behaviour
    # series, which run in this job after the images are built.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: polis_api_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 25462:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polis_api_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: queue-rs
    steps:
      # Some runners arrive with too little free disk for the release build, the test targets and
      # three images (the image step failed with "No space left on device"). Below 40 GB free, remove
      # preinstalled SDKs this job never uses; the removal takes about three minutes, so only then.
      - name: Free runner disk when short
        working-directory: .
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run polis-api checks
        run: make check-polis-api
        working-directory: .
        env:
          POLIS_API_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:25462/polis_api_test
          POLIS_AUTH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:25462/polis_api_test
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}
  polis-migrate:
    name: migration runner and startup refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: polis-migrate-test-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '25850'
      RECOVERY_PG_PORT: '25850'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - name: Run polis-migrate checks
        run: make check-polis-migrate
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}
  job-graphs:
    name: Per-step job graph core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: polis-graph-test-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '25467'
      RECOVERY_PG_PORT: '25467'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Run job-graphs checks
        run: make check-job-graphs
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}
      - name: Retain generated proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-graph-proof
          path: graph-proof/
          retention-days: 7

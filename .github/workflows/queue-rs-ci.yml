name: queue-rs

# Build, lint and test the queue-rs crate (the polis-queue/1 adapter and the
# polis-jobs daemon). The integration tests run against a throwaway
# PostgreSQL 17 service container with the repository's migration chain and
# the draft 000023 vendored under queue-rs/tests/fixtures.
on:
  pull_request:
    paths:
      - 'queue-rs/**'
      - 'server/postgres/migrations/**'
      - '.github/workflows/queue-rs-ci.yml'
  push:
    branches: [edge, stable]
    paths:
      - 'queue-rs/**'
      - 'server/postgres/migrations/**'
      - '.github/workflows/queue-rs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queue-rs:
    name: queue-rs build, clippy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: queue_acceptance
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queue_acceptance"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: queue-rs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain (pinned by queue-rs/rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features jobs-integration -- -D warnings
      - name: Unit and protocol tests
        run: cargo test --locked
      - name: Integration tests (PostgreSQL 17 service)
        env:
          POLIS_JOBS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/queue_acceptance
          POLIS_JOBS_TEST_PYTHON: python3
        run: cargo test --locked --features jobs-integration --test jobs_integration -- --test-threads 4

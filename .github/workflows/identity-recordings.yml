name: Identity recordings
on:
  pull_request:
    branches: [edge, stable]
    paths:
      - 'ci/host_ports.py'
      - 'ci/test_host_ports.py'
      - 'ci/local/**'
      - 'Makefile'
      - 'server/characterization/**'
      - 'queue-rs/polis-api/conformance/identity-run.sh'
      - 'server/__tests__/fixtures/identity/**'
      - 'server/__tests__/unit/identity-recordings.test.ts'
      - 'server/__tests__/unit/participant-jwt-interop.test.ts'
      - 'server/__tests__/fixtures/participant-jwt/**'
      - 'server/__tests__/setup/**'
      - 'server/jest.config.ts'
      - 'server/tsconfig.json'
      - 'server/app.ts'
      - 'server/index.ts'
      - 'server/src/auth/**'
      # Routes and shared dependencies used by the recorded identity requests.
      - 'server/src/**'
      - 'server/postgres/**'
      - 'server/package*.json'
      - 'server/Dockerfile*'
      - 'oidc-simulator/**'
      - 'file-server/**'
      - 'client-participation/**'
      - 'queue-rs/polis-migrate/**'
      - 'queue-rs/polis-contracts/**'
      - 'queue-rs/Cargo.*'
      - 'queue-rs/rust-toolchain.toml'
      - 'scripts/after_install.sh'
      - 'delphi/polismath/utils/vote_convention.py'
      - 'VERSION'
      - '.github/workflows/identity-recordings.yml'
  push:
    branches: [edge]
    paths:
      - 'ci/host_ports.py'
      - 'ci/test_host_ports.py'
      - 'ci/local/**'
      - 'Makefile'
      - 'server/characterization/**'
      - 'queue-rs/polis-api/conformance/identity-run.sh'
      - 'server/__tests__/fixtures/identity/**'
      - 'server/__tests__/unit/identity-recordings.test.ts'
      - 'server/__tests__/unit/participant-jwt-interop.test.ts'
      - 'server/__tests__/fixtures/participant-jwt/**'
      - 'server/__tests__/setup/**'
      - 'server/jest.config.ts'
      - 'server/tsconfig.json'
      - 'server/app.ts'
      - 'server/index.ts'
      - 'server/src/auth/**'
      # Routes and shared dependencies used by the recorded identity requests.
      - 'server/src/**'
      - 'server/postgres/**'
      - 'server/package*.json'
      - 'server/Dockerfile*'
      - 'oidc-simulator/**'
      - 'file-server/**'
      - 'client-participation/**'
      - 'queue-rs/polis-migrate/**'
      - 'queue-rs/polis-contracts/**'
      - 'queue-rs/Cargo.*'
      - 'queue-rs/rust-toolchain.toml'
      - 'scripts/after_install.sh'
      - 'delphi/polismath/utils/vote_convention.py'
      - 'VERSION'
      - '.github/workflows/identity-recordings.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recordings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: p027identity-ci-${{ github.run_id }}-${{ github.run_attempt }}
      P027_PORT_MIN: '26444'
      P027_PORT_MAX: '26446'
      POLIS_RECOVERY_PG_PORT: '26444'
      P027_HTTP_PORT: '26445'
      P027_CONTROL_PORT: '26446'
      P027_SERVER_IMAGE: identity-server
      P027_POSTGRES_IMAGE: identity-postgres
      P027_OIDC_IMAGE: identity-oidc
      P027_FILE_SERVER_IMAGE: identity-files
      P027_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run identity-recordings checks
        run: make check-identity-recordings
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}
      - name: Preserve all outcomes, including failed oracles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: identity-recordings
          path: |
            server/characterization/artifacts/identity-*
            !server/characterization/artifacts/identity-provider-tokens.json

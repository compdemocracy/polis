name: Postgres Delphi result reads
on:
  pull_request:
    paths: ['server/**', 'queue-rs/polis-migrate/**', 'scripts/test-delphi-result-reads.sh', '.github/workflows/delphi-result-reads.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RESULT_READS_PROJECT: result-reads-${{ github.run_id }}-${{ github.run_attempt }}
      RESULT_READS_PG_PORT: '55463'
      RESULT_READS_DYNAMO_PORT: '55464'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: bash scripts/test-delphi-result-reads.sh --ci

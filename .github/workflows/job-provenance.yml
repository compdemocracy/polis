name: Job provenance
on:
  pull_request:
    paths: ['client-report/src/data/provenance.js', 'client-participation-alpha/src/lib/provenance.ts', 'server/characterization/jobviews/**', 'server/characterization/delphi/recordings/**', '.github/workflows/job-provenance.yml', 'ci/local/**', 'Makefile']
  push:
    branches: [edge]
    paths: ['client-report/src/data/provenance.js', 'client-participation-alpha/src/lib/provenance.ts', 'server/characterization/jobviews/**', 'server/characterization/delphi/recordings/**', '.github/workflows/job-provenance.yml', 'ci/local/**', 'Makefile']
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4", cache: npm, cache-dependency-path: server/package-lock.json}
      - name: Run job-provenance checks
        run: make check-job-provenance

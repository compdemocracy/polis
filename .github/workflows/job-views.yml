name: Job view recordings
on:
  pull_request:
    paths: ['client-report/**', 'client-participation-alpha/**', 'server/characterization/jobviews/**', 'server/characterization/delphi/recordings/**', '.github/workflows/job-views.yml', 'ci/local/**', 'Makefile']
  push:
    branches: [edge]
    paths: ['client-report/**', 'client-participation-alpha/**', 'server/characterization/jobviews/**', 'server/characterization/delphi/recordings/**', '.github/workflows/job-views.yml', 'ci/local/**', 'Makefile']
permissions:
  contents: read
jobs:
  views:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4"}
      - name: Run job-views checks
        run: make check-job-views
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}

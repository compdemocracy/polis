name: Deploy to AWS on Push

on: workflow_dispatch

# One production deploy at a time; a second dispatch waits for the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # cdk/buildBox.ts (cdk deploy -c enableBuildBox=true). Assumed through GitHub
  # OIDC; no stored AWS keys.
  DEPLOY_ROLE_ARN: arn:aws:iam::050917022930:role/polis-deploy-github
  DEPLOY_BUCKET: polis-deployment-packages-050917022930-us-east-1
  BUILD_BOX_TEMPLATE: polis-build-box
  # Spot in this order, then on-demand. The same list as
  # BUILD_BOX_INSTANCE_TYPES in cdk/buildBox.ts, which IAM enforces.
  BUILD_BOX_TYPES: c7i.4xlarge c6i.4xlarge c6a.4xlarge m7i.4xlarge

jobs:
  # ==========================================================
  # ==  JOB 1: BUILD & PUSH EVERY IMAGE ON THE BUILD BOX    ==
  # ==========================================================
  # No production box builds anything (scripts/after_install.sh pulls by
  # digest). If this job fails, no deployment is created.
  build-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    outputs:
      manifest: ${{ steps.build.outputs.manifest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Publish v<VERSION> before deploying; identity needs tags and origin/stable.
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: polis-deploy-build-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload this commit's source for the build box
        run: |
          git archive --format=tar.gz -o build-source.tar.gz "$GITHUB_SHA"
          aws s3 cp --only-show-errors build-source.tar.gz "s3://$DEPLOY_BUCKET/build-source/$GITHUB_SHA.tar.gz"

      - name: Build and push every image on the build box
        id: build
        env:
          # client-participation-alpha's public build args. They must equal the
          # values in the production env document (polis-web-app-env-vars); the
          # web box refuses an image built with others.
          PUBLIC_SERVICE_URL: ${{ vars.PUBLIC_SERVICE_URL }}
          AUTH_NAMESPACE: ${{ vars.AUTH_NAMESPACE }}
          OIDC_CACHE_KEY_PREFIX: ${{ vars.OIDC_CACHE_KEY_PREFIX }}
          OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: ${{ vars.OIDC_CACHE_KEY_ID_TOKEN_SUFFIX }}
        run: bash deploy/build-on-box.sh

      # The script terminates its box on exit; this covers a cancelled run.
      - name: Terminate the build box
        if: always()
        run: |
          ids=$(tr '\n' ' ' < build-box-instances.txt 2>/dev/null || true)
          if [ -n "${ids// /}" ]; then aws ec2 terminate-instances --instance-ids $ids > /dev/null || true; fi

  # =====================================================
  # ==      JOB 2: DEPLOY TO PRODUCTION (US)           ==
  # =====================================================
  deploy-us:
    name: Deploy to Production (US)
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials for US
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: polis-deploy-${{ github.run_id }}
          # Two hours (the role's maximum): the steps below wait up to about 30
          # minutes each for their deployments, past the default one hour.
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Create US deployment package
        # The hooks deploy exactly this commit (scripts/after_install.sh), not
        # whatever stable is when each box's turn comes, and pull exactly the
        # image digests the build box reported for it.
        env:
          IMAGE_MANIFEST: ${{ needs.build-images.outputs.manifest }}
        run: |
          git rev-parse HEAD > scripts/deploy-revision.txt
          printf '%s\n' "$IMAGE_MANIFEST" > scripts/deploy-images.txt
          grep -qx "revision=$(cat scripts/deploy-revision.txt)" scripts/deploy-images.txt
          zip -r deployment-us.zip appspec.yml scripts/* docker-compose.yml

      # Each deploy's bundle under its own key, named by its commit, and both
      # deployments below name exactly the object this step wrote: its eTag,
      # and its version in the versioned bucket (cdk/codedeploy.ts). The launch
      # deployment for a box Auto Scaling starts, and CodeDeploy's automatic
      # rollback, deploy the group's last successful revision as it was
      # recorded, so they fetch that deploy's bundle, never a later upload. A
      # revision whose object has since changed fails CodeDeploy's eTag check
      # instead of installing another bundle.
      - name: Upload US deployment package to S3
        id: bundle
        run: |
          key="deployments/$(cat scripts/deploy-revision.txt).zip"
          uploaded=$(aws s3api put-object --bucket "$DEPLOY_BUCKET" --key "$key" --body deployment-us.zip --output json)
          etag=$(jq -r '.ETag // ""' <<< "$uploaded" | tr -d '"')
          version=$(jq -r '.VersionId // ""' <<< "$uploaded")
          if ! grep -Eqx '[0-9A-Za-z._-]+' <<< "$etag"; then
            echo "Error: S3 returned no usable eTag for s3://$DEPLOY_BUCKET/$key; refusing to create a deployment that does not name its object" >&2
            exit 1
          fi
          # Without a version, a re-run of this commit would replace the object
          # the last successful revision names, and every launch deployment and
          # rollback would then fail its eTag check. "null" is a suspended
          # bucket's version id.
          if ! grep -Eqx '[0-9A-Za-z._+/-]+' <<< "$version" || [ "$version" = null ]; then
            echo "Error: S3 returned no usable version id for s3://$DEPLOY_BUCKET/$key (is the bucket versioned?); refusing to create the deployment" >&2
            exit 1
          fi
          location="bucket=$DEPLOY_BUCKET,key=$key,bundleType=zip,eTag=$etag,version=$version"
          echo "Bundle: s3://$DEPLOY_BUCKET/$key (eTag $etag, version $version)"
          echo "s3-location=$location" >> "$GITHUB_OUTPUT"

      # OVERWRITE: CodeDeploy tracks installed files per deployment group, so a
      # box moved between groups would otherwise fail at Install on its own files.
      # Each step waits for its deployment and fails if CodeDeploy ends it Failed
      # or Stopped, so the run's result is the boxes' result. The waiter polls
      # GetDeployment every 15 s and gives up after 120 polls (about 30 minutes),
      # which also fails the step. Workers start only after web has succeeded.
      - name: Create US CodeDeploy deployment (web)
        env:
          BUNDLE_S3_LOCATION: ${{ steps.bundle.outputs.s3-location }}
        run: |
          ID=$(aws deploy create-deployment \
            --application-name PolisApplication \
            --deployment-group-name PolisDeploymentGroup \
            --revision revisionType=S3,s3Location="{$BUNDLE_S3_LOCATION}" \
            --file-exists-behavior OVERWRITE \
            --region us-east-1 \
            --query deploymentId --output text)
          echo "CodeDeploy deployment (web): $ID"
          aws deploy wait deployment-successful --deployment-id "$ID" --region us-east-1

      - name: Create US CodeDeploy deployment (workers)
        env:
          BUNDLE_S3_LOCATION: ${{ steps.bundle.outputs.s3-location }}
        run: |
          ID=$(aws deploy create-deployment \
            --application-name PolisApplication \
            --deployment-group-name PolisWorkersDeploymentGroup \
            --revision revisionType=S3,s3Location="{$BUNDLE_S3_LOCATION}" \
            --file-exists-behavior OVERWRITE \
            --region us-east-1 \
            --query deploymentId --output text)
          echo "CodeDeploy deployment (workers): $ID"
          aws deploy wait deployment-successful --deployment-id "$ID" --region us-east-1

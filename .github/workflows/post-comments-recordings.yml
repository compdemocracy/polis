name: POST comments recordings
on:
  pull_request:
    branches: [edge, stable]
    paths: ['ci/host_ports.py', 'ci/test_host_ports.py', 'server/**', 'queue-rs/polis-contracts/**', 'ci/post_comments_golden_guard.sh', '.github/workflows/post-comments-recordings.yml', 'ci/local/**', 'Makefile']
  push:
    branches: [edge]
    paths: ['ci/host_ports.py', 'ci/test_host_ports.py', 'server/**', 'queue-rs/polis-contracts/**', 'ci/post_comments_golden_guard.sh', '.github/workflows/post-comments-recordings.yml', 'ci/local/**', 'Makefile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-comments-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recordings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: post-comments-ci
      POLIS_RECOVERY_PG_PORT: '26441'
      P027_HTTP_PORT: '26442'
      P027_CONTROL_PORT: '26443'
      P027_SERVER_IMAGE: post-comments-server
      P027_POSTGRES_IMAGE: post-comments-postgres
      P027_OIDC_IMAGE: post-comments-oidc
      P027_FILE_SERVER_IMAGE: post-comments-files
      P027_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run post-comments-recordings checks
        run: make check-post-comments-recordings
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}
      - name: Preserve all outcomes, including failed oracles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: post-comments-recordings
          path: server/characterization/artifacts/comments-ci*

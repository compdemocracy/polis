name: Routing recordings
on:
  pull_request:
    paths: ['ci/host_ports.py', 'ci/test_host_ports.py', 'server/**', '.github/workflows/routing-recordings.yml', 'ci/local/**', 'Makefile']
  push:
    branches: [edge]
    paths: ['ci/host_ports.py', 'ci/test_host_ports.py', 'server/**', '.github/workflows/routing-recordings.yml', 'ci/local/**', 'Makefile']
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: generatedlocal
          POSTGRES_DB: routing_recordings
        ports: ['25630:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      POLIS_RECOVERY_PG_PORT: '25630'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4", cache: npm, cache-dependency-path: server/package-lock.json}
      - name: Run routing-recordings checks
        run: make check-routing-recordings
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}

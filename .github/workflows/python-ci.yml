name: Delphi Python Tests

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ edge, stable ]
    paths: &paths
      - 'delphi/**/*.py'
      - 'delphi/requirements*.txt'
      - 'delphi/Dockerfile'
      - '.github/workflows/python-ci.yml'
      # server/src so a new server-side wildcard runs the projection-gate sweep
      - 'server/src/**'
      # Representative payload tests execute the probe planner and independent gate.
      - 'ci/private_cert/**'
      - 'ci/probe_box/**'
  pull_request:
    branches:
      - edge
      - stable
      - 'jc/**'
    paths: *paths
  # Manual trigger: lets repo write-access users run CI on any branch
  # (including spr/edge/* stack branches, which `pull_request` no longer
  # auto-triggers for). UI: Actions → Delphi Python Tests → "Run workflow".
  # CLI: `gh workflow run "Delphi Python Tests" --ref <branch>`.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 1. Free up disk space on runner
      run: |
        echo "Starting disk cleanup..."
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell
        echo "Disk space after cleanup:"
        df -h

    # BuildKit is required by `RUN --mount=type=cache` in the npm Dockerfiles.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The .env additions, the image builds, the stack with readiness waits, the
    # copy-in of tests and projection-gate scan inputs, pytest with coverage,
    # service logs on failure and teardown all live in ci/local/delphi-python.sh,
    # so `make check-delphi-python` gives the same verdict on any Docker host.
    # The opt-in Postgres integration tests (require_polis_postgres) run against
    # the compose `postgres` service, whose image bakes the polis migrations.
    - name: Run Delphi Pytest
      env:
        DELPHI_COVERAGE_OUT: ${{ github.workspace }}
      run: make check-delphi-python

    - name: 8. Upload Coverage Report
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-comment.md

    - name: 9. Post Coverage Comment
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const commentBody = fs.readFileSync('coverage-comment.md', 'utf8');
          const marker = '<!-- delphi-coverage-report -->';
          const body = `${marker}\n## Delphi Coverage Report\n\n${commentBody}`;

          try {
            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(c => c.body.includes(marker));

            if (existingComment) {
              // Delete existing comment so new one appears after latest commit
              await github.rest.issues.deleteComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              console.log('Existing coverage comment deleted.');
            }

            // Always create a new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Coverage comment posted successfully.');
          } catch (error) {
            if (error.status === 403) {
              console.log('Note: Could not post coverage comment to PR.');
              console.log('This is expected for PRs from forks due to GitHub token permissions.');
              console.log('Coverage report is available in the workflow logs (step 7) and as a downloadable artifact (step 8).');
            } else {
              console.log(`Unexpected error posting comment: ${error.message}`);
            }
          }

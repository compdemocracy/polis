name: Dynamo removal

on:
  pull_request:
    paths:
      - 'delphi/**'
      - 'queue-rs/**'
      - 'server/**'
      - 'client-report/**'
      - 'scripts/test-dynamo-removal.sh'
      - 'scripts/prove-dynamo-report.sh'
      - 'ci/dynamo-removal/**'
      - '.github/workflows/dynamo-removal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamo-removal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      COMPOSE_PROJECT_NAME: polis-graph-test-dynamo-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '55449'
      RECOVERY_PG_PORT: '55449'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Queue toolchain
        working-directory: queue-rs
        run: rustup show active-toolchain
      - name: Install uv
        run: python -m pip install uv==0.9.2
      - name: Queue, Postgres results, importer and report with DynamoDB stopped
        run: bash scripts/test-dynamo-removal.sh
      - name: Retain proof logs and report screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dynamo-removal-proof
          retention-days: 7
          include-hidden-files: true
          path: |
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/*.log
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/demo-result.json
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/sql-source-sha256.json
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/install/results.json
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/results-sql/results.json
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/report/*.log
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/report/browser.json
            .dynamo-proof/${{ env.COMPOSE_PROJECT_NAME }}/report/*.png

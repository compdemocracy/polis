name: Embeddings table

on:
  pull_request:
    paths:
      - 'delphi/**'
      - 'queue-rs/**'
      - 'server/postgres/migrations/**'
      - 'scripts/test-embeddings-table.sh'
      - '.github/workflows/embeddings-table.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embeddings-table-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embeddings-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: polis-graph-test-embtable-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '55451'
      RECOVERY_PG_PORT: '55451'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Queue toolchain
        working-directory: queue-rs
        run: rustup show active-toolchain
      - name: Real-model embeddings-table graph, write/read-back, re-run and switch-off parity
        run: bash scripts/test-embeddings-table.sh
      - name: Retain proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embeddings-table-proof
          retention-days: 7
          include-hidden-files: true
          path: |
            .embtable-proof/${{ env.COMPOSE_PROJECT_NAME }}/*.log
            .embtable-proof/${{ env.COMPOSE_PROJECT_NAME }}/*.json

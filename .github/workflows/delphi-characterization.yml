name: Delphi characterization

# Replays the recorded Delphi read-route characterization (P-077 P2-0) against
# the current server, and checks the frozen storage codec in both languages.
# Generated fixtures only: no production data, no cloud credentials, no
# provider calls. A failure here means a Delphi read route no longer serves the
# recorded bytes, the fixtures no longer regenerate identically, or the codec
# drifted. Re-record only for a deliberate, reviewed behaviour change (see the
# header of server/characterization/delphi/main.cjs).

on:
  pull_request:
    branches: [edge, stable]
  push:
    branches: [edge]
  workflow_dispatch:

concurrency:
  group: delphi-characterization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PostgreSQL 17.11 (host port 5472) and DynamoDB Local pinned by digest
      # (8472, -sharedDb -inMemory), the server modules, the codec tests in both
      # languages, the fixture regeneration check and the replay live in
      # ci/local/delphi-characterization.sh: `make check-delphi-characterization`.
      - name: Codec, fixtures and replay of every recorded case
        run: make check-delphi-characterization

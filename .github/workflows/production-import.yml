name: Production importer
on:
  pull_request:
    paths:
      - 'delphi/**'
      - 'queue-rs/**'
      - 'server/postgres/**'
      - 'scripts/test-production-import.sh'
      - 'scripts/test-import-launcher-mounts.py'
      - 'scripts/run-import-dry-run.py'
      - '.github/workflows/production-import.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-import-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: polis-import-test-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '55461'
      RECOVERY_PG_PORT: '55461'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prove one-shot importer against local DynamoDB
        run: bash scripts/test-production-import.sh
      - name: Retain generated aggregate proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-import-proof
          retention-days: 7
          include-hidden-files: true
          path: |
            .import-proof/${{ env.COMPOSE_PROJECT_NAME }}/unit.log
            .import-proof/${{ env.COMPOSE_PROJECT_NAME }}/integration.log
            .import-proof/${{ env.COMPOSE_PROJECT_NAME }}/source-binding.log
            .import-proof/${{ env.COMPOSE_PROJECT_NAME }}/launcher-mounts.log

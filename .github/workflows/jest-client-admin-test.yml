name: Run Jest Tests - client admin

concurrency:
  group: jest-client-admin-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'ci/local/**'
      - 'Makefile'
      - 'client-admin/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: 'npm'
          cache-dependency-path: client-admin/package-lock.json

      - name: Run client-admin checks
        run: make check-client-admin

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: client-admin/coverage
          flags: client-admin
          name: client-admin-coverage
          fail_ci_if_error: false

name: Public-repo hygiene

# Fails a pull request whose added lines or commit messages reference private
# working material. Runs the same script contributors run locally:
#   scripts/check-public-hygiene.sh origin/edge

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: public-repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check added lines and commit messages against the PR base
        run: scripts/check-public-hygiene.sh "${{ github.event.pull_request.base.sha }}"

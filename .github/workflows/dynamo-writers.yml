name: Postgres Delphi writers
on:
  pull_request:
    paths: ['ci/host_ports.py', 'ci/test_host_ports.py', 'delphi/**', 'server/**', 'queue-rs/**', 'scripts/test-dynamo-writers.sh', '.github/workflows/dynamo-writers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  writers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: polis-graph-test-writers-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '25453'
      RECOVERY_PG_PORT: '25453'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Free runner disk when short
        working-directory: .
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - run: bash scripts/test-dynamo-writers.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delphi-writers-proof
          path: .writer-proof/**/*.log
          include-hidden-files: true
          retention-days: 7

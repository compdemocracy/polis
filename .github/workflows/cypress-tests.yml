name: E2E Tests

on:
  push:
    branches: [ edge, stable ]
  pull_request:
    branches:
      - edge
      - stable
      - 'jc/**'
  # Manual trigger: lets repo write-access users run CI on any branch
  # (including spr/edge/* stack branches, which `pull_request` no longer
  # auto-triggers for). UI: Actions → E2E Tests → "Run workflow".
  # CLI: `gh workflow run "E2E Tests" --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
    
    - name: 1. Free up disk space on runner
      run: |
        echo "Starting disk cleanup..."
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell
        echo "Disk space after cleanup:"
        df -h
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Certificates, the edited test.env, the image builds (postgres without the
    # cache), the stack with readiness waits, the migration re-run, the auth
    # setup check, Cypress and teardown all live in ci/local/e2e.sh, so
    # `make check-e2e` gives the same verdict on any Docker host.
    - name: Run Cypress E2E tests
      run: make check-e2e

    - name: Upload Cypress screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-screenshots
        path: e2e/cypress/screenshots
        if-no-files-found: ignore

    - name: Upload Cypress videos
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-videos
        path: e2e/cypress/videos
        if-no-files-found: ignore

name: E2E Tests

on:
  push:
    branches: [ edge, stable ]
  pull_request:
    branches:
      - edge
      - stable
      - 'jc/**'
  # Manual trigger: lets repo write-access users run CI on any branch
  # (including spr/edge/* stack branches, which `pull_request` no longer
  # auto-triggers for). UI: Actions → E2E Tests → "Run workflow".
  # CLI: `gh workflow run "E2E Tests" --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every step of the check lives in ci/local/e2e.sh, which runs the same way on
  # any Docker host. Hosted CI builds the stack's images once (test-images.yml),
  # splits the specs into shards that each run the whole stack from those
  # images, and the `cypress-run` job puts the shards back together: it proves
  # every spec ran in exactly one shard and adds up the counts per suite.
  images:
    uses: ./.github/workflows/test-images.yml
    with:
      # This workflow runs on every push, so it is the one that keeps the cache.
      write-cache: true

  cypress:
    name: cypress shard ${{ matrix.shard }}
    needs: images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install mkcert
      run: |
        # Install mkcert for certificate generation
        curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
        chmod +x mkcert-v*-linux-amd64
        sudo cp mkcert-v*-linux-amd64 /usr/local/bin/mkcert

        # Install CA in system trust store
        mkcert -install

    - name: Download the test images
      uses: actions/download-artifact@v4
      with:
        name: test-images
        path: ${{ runner.temp }}/test-images

    - name: Load the test images
      run: |
        bash ci/local/test-images.sh load "$RUNNER_TEMP/test-images"
        rm -rf "$RUNNER_TEMP/test-images"
        df -h /

    - name: Cypress (shard ${{ matrix.shard }}/${{ strategy.job-total }})
      env:
        POLIS_TEST_IMAGES: ci
        E2E_CHECK_OUT: ${{ github.workspace }}/e2e-results/shard-${{ matrix.shard }}
        # The runner is discarded after the job; tearing the stack down only costs time.
        E2E_CHECK_KEEP: '1'
      run: bash ci/local/e2e.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

    - name: Upload shard results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-shard-${{ matrix.shard }}
        path: |
          e2e-results/shard-${{ matrix.shard }}
          !e2e-results/shard-${{ matrix.shard }}/stack
        if-no-files-found: ignore

    - name: Upload Cypress screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-screenshots-${{ matrix.shard }}
        path: e2e/cypress/screenshots
        if-no-files-found: ignore

    - name: Upload Cypress videos
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-videos-${{ matrix.shard }}
        path: e2e/cypress/videos
        if-no-files-found: ignore

  cypress-run:
    needs: cypress
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download shard results
      uses: actions/download-artifact@v4
      with:
        pattern: e2e-shard-*
        path: e2e-results

    - name: Combine shards (every spec exactly once, counts per suite)
      run: bash ci/local/e2e.sh combine e2e-results/e2e-shard-*

    - name: Every shard passed
      run: |
        echo "shards: ${{ needs.cypress.result }}"
        test "${{ needs.cypress.result }}" = success

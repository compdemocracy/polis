name: Coordinator Required Campaign

# Triggered on every PR so the required check always reports; the campaign itself runs
# only when a path it can observe changed (the gate step below). Pushes, merge groups
# and manual runs always run the full campaign.
on:
  pull_request:
  push:
    branches: [edge, stable]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordinator-required:
    name: Coordinator S1/S2 required
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: coordinator-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '55492'
      RECOVERY_PG_PORT: '55492'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Test the merge ref. Full history attributes historical pin drift and
          # supplies the independent fold/reference writer's historical blobs.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether this change can reach the campaign
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "full campaign: $EVENT"; exit 0; fi
          # --no-renames: a rename lists both the removed and the added path, so moving a
          # file out of a campaign directory still counts as touching that directory.
          changed=$(git diff --name-only --no-renames "$BASE...$HEAD")
          printf '%s\n' "$changed" | sed 's/^/changed: /'
          if printf '%s\n' "$changed" | grep -Eq '^(coordinator-rs/|delphi/|math/|server/|\.github/workflows/coordinator-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "campaign paths changed: running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no campaign path changed: the required check passes without replay"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.paths.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.paths.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Provision locked candidate and server modules
        if: steps.paths.outputs.run == 'true'
        run: |
          python -m pip install -r coordinator-rs/evidence/python-requirements.txt
          npm ci --prefix server
          cd coordinator-rs
          rustup show active-toolchain
      - name: Coordinator TLS unit and local PostgreSQL refusal controls
        if: steps.paths.outputs.run == 'true'
        working-directory: coordinator-rs
        env:
          COMPOSE_PROJECT_NAME: coordinator-tls-${{ github.run_id }}-${{ github.run_attempt }}
          POLIS_RECOVERY_PG_PORT: '55493'
          RECOVERY_PG_PORT: '55493'
        run: |
          cargo test --locked --features tls-tests --test database
          python tools/d07/test_tls.py
      - name: Run exact candidate campaign and refusal controls
        if: steps.paths.outputs.run == 'true'
        run: python coordinator-rs/ci/run.py --output "$RUNNER_TEMP/coordinator-campaign"
      - name: Retain public receipt, source attribution and failure evidence
        if: always() && steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordinator-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coordinator-campaign
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's disposable database
        if: always() && steps.paths.outputs.run == 'true'
        run: docker compose -f coordinator-rs/ci/compose.yml down -v
      - name: Record that no campaign path changed
        if: steps.paths.outputs.run != 'true'
        run: echo "coordinator campaign not applicable to this change; required check satisfied"

name: Coordinator Required Campaign

# No path filter: this is a stable required-check candidate on every PR.
on:
  pull_request:
  push:
    branches: [edge, stable]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordinator-required:
    name: Coordinator S1/S2 required
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: coordinator-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POLIS_RECOVERY_PG_PORT: '55492'
      RECOVERY_PG_PORT: '55492'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Test the merge ref. Full history attributes historical pin drift and
          # supplies the independent fold/reference writer's historical blobs.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Provision locked candidate and server modules
        run: |
          python -m pip install -r coordinator-rs/evidence/python-requirements.txt
          npm ci --prefix server
          cd coordinator-rs
          rustup show active-toolchain
      - name: Run exact candidate campaign and refusal controls
        run: python coordinator-rs/ci/run.py --output "$RUNNER_TEMP/coordinator-campaign"
      - name: Retain public receipt, source attribution and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordinator-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coordinator-campaign
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's disposable database
        if: always()
        run: docker compose -f coordinator-rs/ci/compose.yml down -v

name: polis-cli release build (no publishing)

# Select the reviewed ref when dispatching. Artifacts are review inputs only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Format, clippy and tests
        run: bash scripts/test-polis-cli.sh
      - name: Build, smoke-test and package native CLI
        run: python3 scripts/build-polis-cli-release.py --target '${{ matrix.target }}' --output '${{ runner.temp }}/polis-cli-release'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polis-cli-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/polis-cli-release/*
          if-no-files-found: error
          retention-days: 14

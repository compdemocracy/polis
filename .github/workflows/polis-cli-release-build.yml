name: Build Polis CLI release assets

# Called only by the explicitly dispatched publication workflow. No tag trigger.
# v<VERSION> is the sole release tag; the retired cli-v path never publishes.
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the exact stable source before building
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/version-target
        run: |
          (cd queue-rs && cargo build --locked --bin polis-version)
          python3 scripts/polis_release.py plan --stable "$RELEASE_COMMIT" --tool "$CARGO_TARGET_DIR/debug/polis-version" --output "$RUNNER_TEMP/review"
          python3 scripts/build-polis-cli-release.py --check-tag "$RELEASE_TAG"
          # Local-only tag gives the existing identity builder stable provenance.
          # Public ref creation happens only in the final approved job.
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          fi
      - name: Format, clippy and tests
        run: bash scripts/test-polis-cli.sh
      - name: Build, smoke-test and package native CLI
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/build-polis-cli-release.py --target "$RELEASE_TARGET" --output "$RUNNER_TEMP/polis-cli-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polis-cli-${{ matrix.target }}-${{ inputs.commit }}
          path: ${{ runner.temp }}/polis-cli-release/*
          if-no-files-found: error
          retention-days: 14

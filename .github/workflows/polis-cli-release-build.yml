name: polis-cli release

# Manual dispatch builds review artifacts; only an existing CLI tag publishes.
on:
  workflow_dispatch:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

concurrency:
  group: polis-cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release tag matches the workspace version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build-polis-cli-release.py --check-tag "$RELEASE_TAG"
      - name: Format, clippy and tests
        run: bash scripts/test-polis-cli.sh
      - name: Build, smoke-test and package native CLI
        run: python3 scripts/build-polis-cli-release.py --target '${{ matrix.target }}' --output '${{ runner.temp }}/polis-cli-release'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polis-cli-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/polis-cli-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: polis-cli-*-${{ github.sha }}
          path: ${{ runner.temp }}/polis-cli-release
          merge-multiple: true
      - name: Validate all targets and publish the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/polis-cli-release
        run: python3 scripts/publish-polis-cli-release.py --directory "$RELEASE_DIRECTORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --repository "$GH_REPO"

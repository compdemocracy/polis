name: TLS trust stores
on:
  pull_request:
    paths:
      - 'ci/local/**'
      - 'Makefile'
      - '**/*Dockerfile*'
      - '**/*requirements*'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - 'polis-cli/Cargo.lock'
      - 'ci/tls/**'
      - 'cdk/lambda/**'
      - 'cdk/test/dbBackupLambda.test.ts'
      - 'cdk/package*.json'
      - 'ci/probe_box/local/**'
      - 'ci/probe_box/ami/**'
      - 'math/distrust-ca.sh'
      - 'server/mise.toml'
      - '.github/workflows/tls-trust.yml'
  push:
    branches: [edge, stable]
    paths:
      - 'ci/local/**'
      - 'Makefile'
      - '**/*Dockerfile*'
      - '**/*requirements*'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - 'polis-cli/Cargo.lock'
      - 'ci/tls/**'
      - 'cdk/lambda/**'
      - 'cdk/test/dbBackupLambda.test.ts'
      - 'cdk/package*.json'
      - 'ci/probe_box/local/**'
      - 'ci/probe_box/ami/**'
      - 'math/distrust-ca.sh'
      - 'server/mise.toml'
      - '.github/workflows/tls-trust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust:
    strategy:
      fail-fast: false
      matrix:
        image: [server, python, nginx, postgres, java, api, migrate, oidc, coordinator, file-server, clients, probe]
    env:
      TLS_IMAGE_SELECTION: ${{ matrix.image }}
    # Match the arm64 runtime/probe builds without emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.image == 'server'
        with:
          node-version: '22.23.4'
      - name: Run tls-trust checks
        run: make check-tls-trust
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHECK_BASE_REF: origin/${{ github.base_ref }}

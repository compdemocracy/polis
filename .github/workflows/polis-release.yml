name: Publish Polis release

on:
  workflow_dispatch:
    inputs:
      stable_commit:
        description: Full current stable merge SHA; publication requires release approval
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: polis-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/edge'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.stable_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release protection and prepare immutable review packet
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          POLIS_RELEASE_REVIEWER: ${{ vars.POLIS_RELEASE_REVIEWER }}
          RELEASE_COMMIT: ${{ inputs.stable_commit }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/version-target
        run: |
          python3 scripts/polis_release.py gate
          (cd queue-rs && cargo build --locked --bin polis-version)
          python3 scripts/polis_release.py plan --stable "$RELEASE_COMMIT" --tool "$CARGO_TARGET_DIR/debug/polis-version" --output "$RUNNER_TEMP/review"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/review/publication.json")); print("tag="+p["tag"])' >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/review/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polis-release-review
          path: ${{ runner.temp }}/review/*
          if-no-files-found: error
          retention-days: 14

  build:
    needs: plan
    uses: ./.github/workflows/polis-cli-release-build.yml
    with:
      commit: ${{ inputs.stable_commit }}
      tag: ${{ needs.plan.outputs.tag }}

  review:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.stable_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: polis-release-review
          path: ${{ runner.temp }}/review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: polis-cli-*-${{ inputs.stable_commit }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Show exact inputs and eight checksums before approval
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/version-target
        run: |
          (cd queue-rs && cargo build --locked --bin polis-version)
          python3 scripts/polis_release.py verify --packet "$RUNNER_TEMP/review/publication.json" --assets "$RUNNER_TEMP/assets" --tool "$CARGO_TARGET_DIR/debug/polis-version" > "$RUNNER_TEMP/verified.json"
          {
            cat "$RUNNER_TEMP/review/notes.md"
            cat "$RUNNER_TEMP/verified.json"
            python3 scripts/polis_release.py commands --packet "$RUNNER_TEMP/review/publication.json" --assets "$RUNNER_TEMP/assets" --tool "$CARGO_TARGET_DIR/debug/polis-version"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [plan, build, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.stable_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: polis-release-review
          path: ${{ runner.temp }}/review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: polis-cli-*-${{ inputs.stable_commit }}
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Revalidate approved inputs and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          POLIS_RELEASE_REVIEWER: ${{ vars.POLIS_RELEASE_REVIEWER }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/version-target
        run: |
          (cd queue-rs && cargo build --locked --bin polis-version)
          python3 scripts/polis_release.py publish --packet "$RUNNER_TEMP/review/publication.json" --assets "$RUNNER_TEMP/assets" --tool "$CARGO_TARGET_DIR/debug/polis-version"

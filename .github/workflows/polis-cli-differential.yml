name: polis-cli-differential

# Independent client-data proof for every Rust route and CLI change. The
# existing byte replay and nginx/wire gates remain separate checks.
on:
  pull_request:
    paths:
      - 'polis-cli/**'
      - 'queue-rs/**'
      - 'server/**'
      - 'file-server/nginx/**'
      - 'oidc-simulator/**'
      - 'scripts/*polis-cli*.sh'
      - '.github/workflows/polis-cli-differential.yml'
  push:
    branches: [edge, stable]
    paths:
      - 'polis-cli/**'
      - 'queue-rs/**'
      - 'server/**'
      - 'file-server/nginx/**'
      - 'oidc-simulator/**'
      - 'scripts/*polis-cli*.sh'
      - '.github/workflows/polis-cli-differential.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: polis-cli-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: p027cli-diff-${{ github.run_id }}-${{ github.run_attempt }}
      P027_PORT_MIN: '56201'
      P027_PORT_MAX: '56203'
      POLIS_RECOVERY_PG_PORT: '56201'
      RECOVERY_PG_PORT: '56201'
      P027_HTTP_PORT: '56202'
      P027_CONTROL_PORT: '56203'
      CLI_DIFF_NODE_IMAGE: cli-diff-node:ci
      CLI_DIFF_POSTGRES_IMAGE: cli-diff-postgres:ci
      CLI_DIFF_OIDC_IMAGE: cli-diff-oidc:ci
      CLI_DIFF_RUST_IMAGE: cli-diff-rust:ci
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build generated-fixture tools and images
        run: bash scripts/prepare-polis-cli-differential.sh
      - name: Compare every command with Rust switches off and on
        run: bash scripts/test-polis-cli-differential.sh --binary ../target/debug/polis --output "${{ runner.temp }}/differential-results.json"
      - name: Setup admission table matches Node (every entry path, action and setting)
        env:
          COMPOSE_PROJECT_NAME: setup-admission-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/test-setup-admission.sh
      - name: Safe structured result (no response values or credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-differential
          path: ${{ runner.temp }}/differential-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove owned stack on cancellation or failure
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f server/characterization/compose.yml -f polis-cli/tests/differential/compose.yml down -v --remove-orphans --timeout 1

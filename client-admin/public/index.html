<!doctype html>
<html lang="en">
  <head>
    <title>Polis</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <!-- Space Mono, copied from a pinned npm package into this build (see webpack.config.js) -->
    <% htmlWebpackPlugin.options.fontStylesheets.forEach(function (href) { %>
    <link href="<%= href %>" rel="stylesheet" />
    <% }) %>
    <!-- 100% privacy-first analytics -->
    <% if (htmlWebpackPlugin.options.isProduction) { %>
    <script
      data-collect-dnt="true"
      async
      src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript
      ><img
        src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true"
        alt=""
        referrerpolicy="no-referrer-when-downgrade"
    /></noscript>
    <% } %>
    <style>
      * {
        font-variant-ligatures: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      #root {
        width: 100%;
        overflow-x: hidden;
      }
    </style>
  </head>

  <body class="viewport avenir">
    <div id="root"></div>
  </body>
</html>

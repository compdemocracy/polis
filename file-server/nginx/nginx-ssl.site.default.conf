# The small formatter runs only for nginx's local not-found response.
js_import edge_errors from /etc/nginx/edge-errors.js;
js_set $polis_not_found edge_errors.notFound;

# Empty unless RUST_API_ROUTES is set (docker-entrypoint.sh).
include /etc/nginx/rust-api/upstreams.conf;

server {
    listen      [::]:80 ipv6only=off;
    listen      [::]:443 ipv6only=off ssl http2;
    server_name _;
    client_max_body_size 50M;

    ssl_certificate /etc/nginx/certs/snakeoil.cert.pem;
    ssl_certificate_key /etc/nginx/certs/snakeoil.key.pem;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA26';
    ssl_prefer_server_ciphers on;

    location /_astro/ {
        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /alpha/ {
        # This rule removes the /alpha prefix before sending to the container.
        # e.g., /alpha/embed.js becomes /embed.js
        # e.g., /alpha/9hhmb5fufv becomes /9hhmb5fufv
        rewrite ^/alpha/(.*)$ /$1 break;

        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # This public document starts with digits, so exact matches take priority
    # over the conversation-page regex (including its optional Rust route).
    location = /404.html { include /etc/nginx/static-proxy.conf; }
    location = /404.html.headersJson { include /etc/nginx/static-proxy.conf; }

    # Paths polis-api serves when RUST_API_ROUTES names them; empty otherwise.
    include /etc/nginx/rust-api/locations.conf;

    # API prefixes, operational endpoints and registered pages retain Node's
    # routing, auth, preload and redirect behavior. Rust selections above win.
    # String routes in Express are case insensitive; regex pages are not.
    location ~* ^/(api/|feeds/[^/]+(?:/(?:consensus|topics))?/?$|iip/[^/]+/?$|iim/[^/]+/?$|robots\.txt/?$|perfStats_9182738127/?$) {
        include /etc/nginx/node-proxy.conf;
    }

    # Keep the page regexes as broad as their existing Node registrations.
    # Page retirement is separate from moving the static proxy to nginx.
    location = / { include /etc/nginx/node-proxy.conf; }
    location ~ ^/(?:[0-9][0-9A-Za-z]+|(?:explore|share|summary|ot|demo|m)/[0-9][0-9A-Za-z]+) {
        include /etc/nginx/node-proxy.conf;
    }
    location ~ ^/(?:report|narrativeReport|stats|commentsReport|topicReport|topicsVizReport|topicHierarchy|collectiveStatements|exportReport|topicMapNarrativeReport|topicStats)/r?[0-9][0-9A-Za-z]+ {
        include /etc/nginx/node-proxy.conf;
    }
    location ~ ^/(?:polis_site_id|conversation/create|integrate|other-conversations|account|bot|conversations|signout|signin|gov|createuser|contrib|hk|s(?:/|$)|inboxApiTest|pwreset|home) {
        include /etc/nginx/node-proxy.conf;
    }
    location ~ ^/(?:user/(?:create|login|logout)|settings|ops|inbox)(?:/.*)?$ {
        include /etc/nginx/node-proxy.conf;
    }
    # Include the trailing slash forms that Node's catch-all redirects.
    location ~ ^/(?:football|pdf|nabi|privacy|tos|donate|demo|company|embed|embedPreprod|embedReport|embedReportPreprod|styleguide|about|__webpack_hmr|dist/admin_bundle\.js)/?$ {
        include /etc/nginx/node-proxy.conf;
    }

    # Built asset directories, report bundles and vendor libraries, and the
    # file-server's public documents. Preserve sidecar-driven cache, gzip and
    # content-type headers by going straight to the same file-server.
    location ~ ^/(?:static|js|css|assets|images|fonts|twemoji)/ {
        include /etc/nginx/static-proxy.conf;
    }
    location ~ ^/(?:admin|participation|report)/build-info\.json(?:\.headersJson)?$ {
        include /etc/nginx/static-proxy.conf;
    }
    location ~ ^/(?:report_bundle.*\.js|report_style.*\.css|report_vendor_.*\.js)(?:\.(?:map|gz|LICENSE\.txt|headersJson))?$ {
        include /etc/nginx/static-proxy.conf;
    }
    location ~ ^/(?:embed(?:Preprod)?\.js|index(?:_admin|_report)?\.html|embed(?:Preprod|Report|ReportPreprod)?\.html|favicon\.ico|bg_collective\.png|bg_map\.png|export_links\.png|bg2050(?:_fr)?\.png|beeswarm\.png|collective\.png)(?:\.headersJson)?$ {
        include /etc/nginx/static-proxy.conf;
    }

    # Unknown paths never enter the application or the file-server. Match
    # finalhandler's HTML body, including method, escaped path and HEAD length.
    location / {
        types { }
        default_type "text/html; charset=utf-8";
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        return 404 $polis_not_found;
    }
}

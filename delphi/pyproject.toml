[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delphi-polis"
version = "0.1.0"
description = "Mathematical analytics pipeline for Polis conversations"
requires-python = ">=3.12,<3.13" # Pin to Python 3.12.x

dependencies = [
    "numpy>=1.26.4,<2.0",
    "pandas>=2.1.4",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary==2.9.10",
    "boto3==1.34.70",
    "scikit-learn>=1.4.2",
    "scipy>=1.12.0",
    "tqdm==4.66.2",
    "matplotlib==3.10.6",
    "ddtrace>=3.16.2",
    # API dependencies
    "fastapi==0.115.0",
    "uvicorn>=0.20.0",
    "starlette>=0.22.0",
    "python-multipart>=0.0.5",
    "itsdangerous>=2.0.0",
    "jinja2>=3.0.0",
    "pydantic>=2.11.9",
    "python-dotenv>=0.21.0",
    # Orchestrator
    "colorlog>=6.9.0",
    # PyTorch dependencies
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    # UMAP narrative dependencies
    "umap-learn>=0.5.7",
    "sentence-transformers>=2.2.0",
    "hdbscan>=0.8.40",
    "numba>=0.61.2",
    "evoc>=0.1.3", # Embedding Vector Oriented Clustering
    # Visualization
    "datamapplot>=0.6.4",
    "plotly>=6.3.1",
    # AWS and DynamoDB
    "pynamodb>=5.4.0",
    "aws-lambda-powertools>=2.15.0",
    "aws-xray-sdk>=2.12.0",
    # LLM and reporting
    "requests>=2.28.0",
    "xmltodict>=0.13.0",
    "anthropic>=0.116.0",
    "ollama>=0.5.1",
    "llvmlite>=0.44.0",
    # CLI
    "click>=8.0.0",
    "rich>=13.0.0",
    # Type compatibility (Python < 3.11)
    "typing_extensions>=4.0.0",
    "natsort>=8.4.0",
    "click>=8.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-check>=2.0.0",
    "pytest-timestamper>=0.0.10",  # Timestamps in -v mode to detect hung tests
    "httpx>=0.23.0",
    "pytest-xdist>=3.8.0",
    "moto>=4.1.0",
    # Code quality - streamlined modern stack
    "pre-commit>=4.3.0",
    # Dependency management
    "pip-tools>=7.5.2",
    # Type stubs
    "types-requests",
    "types-psycopg2",
    # pandas 2.3 has no `py.typed` marker, so pyright falls back to bundled
    # stubs that mistype DataFrame.__getitem__ as ndarray. pandas-stubs is the
    # official stubs package from the pandas-dev org and resolves ~50 false
    # positives in polismath/pca_kmeans_rep/repness.py alone.
    "pandas-stubs>=3.0.3.260530",
    # Profiling
    "line_profiler>=4.0.0",
]

notebook = [
    "ipython>=8.0.0",
    "jupyter-client>=8.6.3",
    "jupyter-core>=5.8.1",
    "jupyter>=1.0.0",
    "matplotlib>=3.10.6",
    "nbconvert>=7.16.6",
    "seaborn>=0.13.2",
]

[project.scripts]
delphi = "scripts.delphi_cli:main"
run-delphi = "run_delphi:main"
# Pipeline entry points
run-math-pipeline = "polismath.run_math_pipeline:main"
run-umap-pipeline = "umap_narrative.run_pipeline:main"
calculate-extremity = "umap_narrative.501_calculate_comment_extremity:main"
calculate-priorities = "umap_narrative.502_calculate_priorities:main"
# Utility entry points
reset-conversation = "umap_narrative.reset_conversation:main"
create-datamapplot = "umap_narrative.700_datamapplot_for_layer:main"
setup-minio = "setup_minio:setup_minio_bucket"

# Hatchling configuration
[tool.hatch.build.targets.wheel]
packages = ["polismath", "umap_narrative"]

[tool.hatch.build.targets.sdist]
include = [
    "/polismath",
    "/umap_narrative",
    "/scripts",
    "/tests",
    "/docs",
    "*.py",
    "*.md",
    "*.toml",
    "*.txt",
]

# Pytest configuration
[tool.pytest.ini_options]
# Force sequential execution (-n0) to leverage the session-scoped conversation cache.
# The cache shares computed conversations across test files, but each xdist worker
# has its own process with a separate cache. With only 2 datasets (biodiversity, vw),
# sequential execution with caching is ~6x faster than parallel execution where each
# worker recomputes the conversations independently.
addopts = "-n0"
filterwarnings = [
    # Ignore python_multipart deprecation warning from ddtrace (third-party)
    "ignore:Please use `import python_multipart`:PendingDeprecationWarning:ddtrace.internal.module",
    # Ignore botocore datetime.utcnow() deprecation warning (third-party)
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:botocore",
]
markers = [
    "local_dataset: mark test as using local (non-committed) datasets from real_data/.local/",
    "clojure_comparison: mark test as comparing with Clojure reference implementation (can be excluded with '-m \"not clojure_comparison\"')",
    "integration: mark test as an opt-in integration test needing a real Postgres (self-skips if docker/port unavailable)",
    "recovery: P-022 §C poller recovery matrix (R01-R12); REQUIRES a real Postgres via POLIS_TEST_POSTGRES_URL and FAILS (never skips) without one — run via `make test-recovery`",
]

[tool.coverage.run]
relative_files = true

# Pyright / Pylance configuration
#
# Pyright walks up from any opened file looking for `pyrightconfig.json` or a
# `[tool.pyright]` section. When it finds this one, `delphi/` becomes the project
# root and `venvPath` is resolved relative to that. So `.venv` here means
# `delphi/.venv`, which on every developer's machine should be either the real
# venv or a symlink to it (the Makefile's `venv` target and `uv sync` both
# maintain this). The mirror `polis/.venv` (also real or symlink) is what lets
# editors opening the workspace at the repo root auto-discover the interpreter.
[tool.pyright]
include = ["polismath", "umap_narrative", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.venv",
    "build",
    "dist",
    "notebooks",
    "scratch",
    "real_data",
    ".test_outputs",
    "pipeline_results",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

# Strictness.
#
# `typeCheckingMode` was previously unset, which meant "whatever this pyright
# release defaults to". Pinning it makes an upgrade a deliberate change rather
# than a silent one. It applies to everything in `include` above.
typeCheckingMode = "standard"

# `polismath/` is annotated to 100% of parameters and returns, so it is held to
# a higher bar than the rest of `include`. The rules below are pyright's
# `strict`-mode settings that ALREADY hold across `polismath/` with zero
# diagnostics, promoted to errors so they stay held. The load-bearing one is
# `reportMissingParameterType`: it is what stops the annotation coverage
# regressing one unannotated parameter at a time.
#
# Scoped to `polismath/` deliberately. `umap_narrative/`, `tests/` and
# `scripts/` are NOT annotated to the same level yet (2742 parameters there
# still have no annotation), so promoting these repo-wide would fail on day
# one. Widening the root is the follow-on once those are annotated too.
[[tool.pyright.executionEnvironments]]
root = "polismath"
reportMissingParameterType = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportTypeCommentUsage = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportInconsistentOverload = "error"
reportOverlappingOverload = "error"
reportInvalidStubStatement = "error"
reportIncompleteStub = "error"
reportInvalidTypeVarUse = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryContains = "error"
reportUnusedExpression = "error"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportMatchNotExhaustive = "error"
reportShadowedImports = "error"
reportUninitializedInstanceVariable = "error"

# NOT enabled for `polismath/` either, with the reason. Each number is the
# diagnostic count that rule adds on top of `standard` today; none can be
# cleared by annotation alone, so none is silenced with an `Any` or an ignore
# comment.
#
#   reportUnknownVariableType      976 |
#   reportUnknownMemberType        913 | numpy / pandas / sqlalchemy inference.
#   reportUnknownArgumentType      791 | An `ndarray` element or a DataFrame
#   reportMissingTypeArgument      141 | column is `Any` at the library
#   reportUnknownParameterType     129 | boundary; annotating our side does
#   reportUnknownLambdaType         79 | not make the library's side known.
#
#   reportUnusedImport              61 | Dead-import cleanup: a behaviour-safe
#   reportUnusedVariable             6 | but separate change (some are
#   reportDuplicateImport            1 | re-exports).
#   reportPrivateUsage              39 | The replay/regression harnesses reach
#                                      | into engine internals on purpose.
#   reportImplicitOverride          18 | Needs `@override` decorators added.
#   reportUnnecessaryIsInstance     18 | Defensive isinstance chains on values
#   reportUnnecessaryComparison     13 | typed narrower than they arrive.
#   reportMissingTypeStubs          10 | Third-party packages ship no stubs.
#
# Blanket `strict` on `polismath/` reports 3192 today; `standard` reports 130.
# Neither is reachable by adding annotations — closing them means editing logic.
